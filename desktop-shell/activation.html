<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' file:; style-src 'unsafe-inline'; script-src 'self'">
  <title>Activate UpdateX</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 25%,#382325 0,#242424 42%,#171717 100%);color:#f5f5f5;font:14px Segoe UI,Arial,sans-serif}.card{width:min(520px,calc(100vw - 32px));padding:38px;border:1px solid #484040;border-radius:18px;background:#202020;box-shadow:0 24px 70px #0008}.logo{width:190px;max-height:130px;height:auto;object-fit:contain;display:block;margin:0 auto 22px}.eyebrow{margin:0 0 8px;color:#ff8a00;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}h1{margin:0;font-size:27px;font-weight:650;letter-spacing:-.02em}p{line-height:1.55;color:#bbb}.intro{margin:11px 0 26px}label{display:block;margin:0 0 8px;font-weight:600}input{width:100%;padding:14px;border:1px solid #5b5555;border-radius:8px;background:#151515;color:#fff;font:600 15px Consolas,monospace;letter-spacing:.04em}input:focus,button:focus-visible{outline:2px solid #ff8a00;outline-offset:2px}button{width:100%;margin-top:17px;padding:14px;border:0;border-radius:8px;background:#ff343c;color:#fff;font:700 15px Segoe UI,Arial,sans-serif;cursor:pointer}button:hover{background:#e92c34}button:disabled{opacity:.6;cursor:wait}.message{min-height:24px;margin-top:17px;color:#ffb8bb}.message.success{color:#6de49a}.footer{margin:25px 0 0;border-top:1px solid #393939;padding-top:17px;font-size:12px;color:#a6a6a6}
  </style>
</head>
<body><main class="card">
  <img id="logo" class="logo" src="UpdateX_Logo.png" alt="UpdateX logo">
  <p class="eyebrow">Offline license activation</p>
  <h1>Activate UpdateX</h1>
  <p class="intro">Enter your UpdateX license key to unlock this Windows application. Validation happens on this computer; no internet connection or account is required.</p>
  <form id="activation-form">
    <label for="license-key">License key</label>
    <input id="license-key" type="password" placeholder="UPDX-XXXXX-XXXXX-XXXXX-XXXXX" autocomplete="off" spellcheck="false" required maxlength="28">
    <button id="activate" type="submit">Activate License</button>
  </form>
  <div id="message" class="message" role="status" aria-live="polite"></div>
  <p class="footer">Your key is not sent to a server. After activation, choose Sign In, Sign Up, or Continue as Guest.</p>
</main><script src="activation.js"></script></body>
</html>
