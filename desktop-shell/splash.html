<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'">
  <title>UpdateX</title>
  <style>
    body { margin: 0; background: #242424; color: #f5f5f5; font: 14px "Segoe UI", sans-serif; display: grid; place-items: center; height: 100vh; }
    main { text-align: center; }
    img { width: 230px; height: auto; max-width: 80vw; }
    .spinner { width: 34px; height: 34px; border: 3px solid #444; border-top-color: #ff343c; border-radius: 50%; margin: 32px auto 20px; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main>
    <img src="branding/UpdateX_Logo.png" alt="UpdateX">
    <div class="spinner" role="status" aria-label="Checking activation and starting local services"></div>
    <p>Checking activation and starting local services…</p>
  </main>
</body>
</html>
