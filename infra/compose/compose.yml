services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: updatepilot
      POSTGRES_USER: updatepilot
      POSTGRES_PASSWORD: updatepilot_dev
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - updatepilot_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U updatepilot -d updatepilot"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  updatepilot_pg:
